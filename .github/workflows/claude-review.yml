name: Claude Code Review

# Reviews each PR once, when it opens — not on every push, which would pay for
# a full new review each time. To review again after changes, open the PR's
# Checks tab and click "Re-run" on "Multi-perspective review".
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    name: Multi-perspective review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # Runs on the Claude subscription (no per-review API bill). One-time setup:
    #   claude setup-token
    #   gh secret set CLAUDE_CODE_OAUTH_TOKEN
    # Without the secret (or on Dependabot PRs, which can't read secrets) the
    # review is skipped instead of failing the PR.
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow's own token posts the review, so no GitHub App install is needed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # A prompt makes the action review automatically, without an @claude mention.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request from five perspectives:

            1. **Security**: Hardcoded secrets? Unvalidated input? Auth gaps? Client data in LLM prompts?
            2. **Architecture**: Layer violations? Business logic in wrong layer? Missing ADR for a significant decision?
            3. **Testing**: Domain logic without tests? Missing E2E for changed flows? flows.json updated?
            4. **Design/UX**: Semantic tokens used? Dark mode works? Missing states (loading/error/empty)?
            5. **Code quality**: Readable? Types tight (no `any`)? `eslint --max-warnings 0` passes? Conventional commit format?

            For each issue: state the file + line, severity (blocker/suggestion), and what to fix.
            End with: **Approved** or **Changes requested** + one sentence of reasoning.
            Post the review as one comment on the pull request, with inline comments for specific lines.
          # Lets the review read the PR and post its comments (nothing else).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
